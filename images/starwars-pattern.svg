<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="231" viewBox="0 0 300 231">
  <defs>
    <!-- Each symbol is centered on (0,0) and roughly 14-18px tall. -->

    <!-- Grogu: round head, two big ears, tiny eyes -->
    <g id="grogu">
      <ellipse cx="0" cy="0" rx="4.2" ry="3.8"/>
      <path d="M-4,-0.5 Q-8,-1.5 -9,2 Q-6,2.5 -3.5,1.5"/>
      <path d="M4,-0.5 Q8,-1.5 9,2 Q6,2.5 3.5,1.5"/>
      <circle cx="-1.4" cy="-0.4" r="0.55" fill="#9bb380" stroke="none"/>
      <circle cx="1.4" cy="-0.4" r="0.55" fill="#9bb380" stroke="none"/>
      <path d="M-1.2,1.6 Q0,2.1 1.2,1.6"/>
    </g>

    <!-- Vader helmet: T-shape mask with chin -->
    <g id="vader">
      <path d="M-5,5 L-5,-2 Q-3,-7 0,-7 Q3,-7 5,-2 L5,5 Q3,6 0,6 Q-3,6 -5,5 Z"/>
      <path d="M-3.2,-1 L-1.4,0 L-3.2,1"/>
      <path d="M3.2,-1 L1.4,0 L3.2,1"/>
      <line x1="-1.2" y1="3" x2="1.2" y2="3"/>
    </g>

    <!-- Stormtrooper helmet: oval w/ visor -->
    <g id="trooper">
      <path d="M-4.5,4 L-4.5,-1 Q-3,-6 0,-6 Q3,-6 4.5,-1 L4.5,4 Q2.5,5 0,5 Q-2.5,5 -4.5,4 Z"/>
      <path d="M-3.5,-1.5 Q0,-3.5 3.5,-1.5 Q3.5,0 0,0.5 Q-3.5,0 -3.5,-1.5 Z"/>
      <line x1="-1.5" y1="3" x2="1.5" y2="3"/>
    </g>

    <!-- Mandalorian helmet: T-visor -->
    <g id="mando">
      <path d="M-5,5 L-5,-2 Q-3,-7 0,-7 Q3,-7 5,-2 L5,5 Q2.5,6 0,6 Q-2.5,6 -5,5 Z"/>
      <path d="M-2.5,-2.5 L2.5,-2.5 L2.5,-1.2 L0.7,-1.2 L0.7,2 L-0.7,2 L-0.7,-1.2 L-2.5,-1.2 Z"/>
    </g>

    <!-- BB-8: sphere + dome, eye -->
    <g id="bb8">
      <circle cx="0" cy="2.2" r="5"/>
      <path d="M-3.2,-1.8 Q-3.2,-5.5 0,-5.5 Q3.2,-5.5 3.2,-1.8 Z"/>
      <circle cx="0" cy="-3.5" r="0.9"/>
      <circle cx="0" cy="2.2" r="1.4"/>
    </g>

    <!-- R2-D2: dome + cylindrical body -->
    <g id="r2d2">
      <path d="M-3,-2 Q-3,-6 0,-6 Q3,-6 3,-2"/>
      <rect x="-3" y="-2" width="6" height="8" rx="0.5"/>
      <circle cx="0" cy="-4" r="0.7"/>
      <line x1="-3" y1="0" x2="3" y2="0"/>
      <rect x="-2" y="1.5" width="4" height="1.5"/>
    </g>

    <!-- TIE Fighter: orb + 2 hex wings -->
    <g id="tie">
      <circle cx="0" cy="0" r="2.4"/>
      <path d="M-5,-4 L-7,0 L-5,4 L-5,-4 Z"/>
      <path d="M5,-4 L7,0 L5,4 L5,-4 Z"/>
      <line x1="-2.4" y1="0" x2="-5" y2="0"/>
      <line x1="2.4" y1="0" x2="5" y2="0"/>
    </g>

    <!-- X-Wing: cross silhouette -->
    <g id="xwing">
      <path d="M-8,0 L4,-1.2 L7,-0.7 L7,0.7 L4,1.2 L-8,0 Z"/>
      <line x1="-8" y1="0" x2="-9" y2="0"/>
      <path d="M2,-1 L-5,-4 L-5,-2.5 L2,-1"/>
      <path d="M2,1 L-5,4 L-5,2.5 L2,1"/>
      <circle cx="-5" cy="-3.2" r="0.5" fill="#9bb380" stroke="none"/>
      <circle cx="-5" cy="3.2" r="0.5" fill="#9bb380" stroke="none"/>
    </g>

    <!-- Death Star: big circle + dish + equator -->
    <g id="deathstar">
      <circle cx="0" cy="0" r="6.5"/>
      <circle cx="-2.5" cy="-2.5" r="1.6"/>
      <line x1="-6.3" y1="1" x2="6.3" y2="1"/>
    </g>

    <!-- Star Destroyer: arrowhead triangle -->
    <g id="destroyer">
      <path d="M-8,3 L8,0 L-8,-3 Z"/>
      <line x1="-5" y1="-1.2" x2="2" y2="-1"/>
      <line x1="-5" y1="1.2" x2="2" y2="1"/>
    </g>

    <!-- AT-ST: box body + two splayed legs -->
    <g id="atst">
      <rect x="-3.5" y="-4.5" width="7" height="5" rx="0.6"/>
      <line x1="-2.5" y1="-2.8" x2="0" y2="-2.8"/>
      <path d="M-2.5,0.5 L-4,5"/>
      <path d="M2.5,0.5 L4,5"/>
      <line x1="-4" y1="5" x2="-2.5" y2="5"/>
      <line x1="2.5" y1="5" x2="4" y2="5"/>
    </g>

    <!-- Yoda: small head + long pointed ears -->
    <g id="yoda">
      <ellipse cx="0" cy="1" rx="3.5" ry="3.8"/>
      <path d="M-3.2,0 L-7,-3.5 L-3.5,-1.8"/>
      <path d="M3.2,0 L7,-3.5 L3.5,-1.8"/>
      <circle cx="-1.2" cy="0.5" r="0.4" fill="#9bb380" stroke="none"/>
      <circle cx="1.2" cy="0.5" r="0.4" fill="#9bb380" stroke="none"/>
      <path d="M-1,2.5 Q0,3.2 1,2.5"/>
    </g>

    <!-- Chewbacca: tall furry head -->
    <g id="chewie">
      <path d="M-4,6 L-4.5,-2 Q-3,-7 0,-7 Q3,-7 4.5,-2 L4,6 Q2,7 0,7 Q-2,7 -4,6 Z"/>
      <path d="M-4.5,-1 l-1.2,-0.8 M-4,-3.5 l-1.2,-0.5 M4.5,-1 l1.2,-0.8 M4,-3.5 l1.2,-0.5"/>
      <path d="M-4,2 l-1.2,0.6 M4,2 l1.2,0.6"/>
      <circle cx="-1.4" cy="-1" r="0.5" fill="#9bb380" stroke="none"/>
      <circle cx="1.4" cy="-1" r="0.5" fill="#9bb380" stroke="none"/>
      <path d="M-1.5,1.5 Q0,2.5 1.5,1.5"/>
    </g>

    <!-- Lightsaber: hilt + blade -->
    <g id="saber">
      <rect x="-0.9" y="2" width="1.8" height="4" rx="0.3"/>
      <line x1="0" y1="2" x2="0" y2="-7"/>
      <line x1="-0.9" y1="2" x2="0.9" y2="2"/>
    </g>

    <!-- Millennium Falcon: oval w/ dish & mandibles -->
    <g id="falcon">
      <ellipse cx="0" cy="0" rx="6.5" ry="3"/>
      <path d="M-6.5,0 L-9,-1 L-9,1 Z"/>
      <circle cx="2" cy="-1.5" r="1.2"/>
      <line x1="-3" y1="0" x2="3" y2="0"/>
    </g>

    <!-- Stars / sparkle (filler) -->
    <g id="spark">
      <path d="M0,-2 L0.5,-0.5 L2,0 L0.5,0.5 L0,2 L-0.5,0.5 L-2,0 L-0.5,-0.5 Z"/>
    </g>
  </defs>

